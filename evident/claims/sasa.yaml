claims:
  - id: proteon-sasa-vs-biopython-ci
    title: Proteon SASA agrees with Biopython on a fixed CI fixture
    kind: measurement
    subsystem: sasa
    case: claims/sasa.md
    source: ..
    tier: ci
    trust_strategy:
      - validation
    capabilities:
      - sasa-accuracy-pointwise
    inputs:
      corpus: 1crn-fixture
      n: 1
      class: single-chain
      fixture_path: tests/fixtures/1crn.pdb
    outputs:
      total_sasa:
        unit: A^2
        description: Per-structure total solvent-accessible surface area.
    pinned_versions:
      proteon: "0.2.0"
      Biopython: "1.87"
      python: "3.12"
    claim: >
      Proteon's Shrake-Rupley solvent-accessible surface area agrees with
      Biopython's reference Shrake-Rupley implementation on the crambin
      (1crn) fixture to within 2% relative difference on total SASA, on
      every CI run.
    tolerances:
      - metric: relative_error
        op: "<"
        value: 0.02
        prose: >
          |proteon_total - biopython_total| / biopython_total < 0.02 on 1crn
          at the proteon and Biopython defaults (probe radius 1.4 A, default
          sphere discretisation). Asserted in
          tests/test_sasa.py::TestBiopythonOracle::test_total_sasa_matches_biopython.
    evidence:
      oracle:
        - Biopython
      command: pytest tests/test_sasa.py::TestBiopythonOracle -v
      artifact: pytest console output (CI-tier; no persisted artifact)
    provenance: automatic
    last_verified:
      commit: null
      date: null
      value: null
      corpus_sha: null
    assumptions:
      - Biopython's Bio.PDB.SASA.ShrakeRupley uses the same probe radius
        (1.4 A) class as proteon's default call.
      - The vendored 1crn PDB is parsed equivalently by both stacks
        (atom set, altloc, hetero handling).
      - The 2% tolerance encodes Shrake-Rupley sphere-discretisation noise
        and float-reordering between proteon and Biopython, not a license
        to ship larger drifts.
    failure_modes:
      - Single-oracle agreement can mask a shared Shrake-Rupley convention
        choice (probe radius, atomic-radii table); the release-tier claim
        plus the FreeSASA gap below addresses Rule 5 "Use Independent
        Validation".
      - Crambin is small and dense; tolerances that pass on 1crn need not
        survive on large multi-chain assemblies. The release-tier claim
        covers that distribution.
      - A regression in Biopython's atomic-radii table would shift the
        oracle without proteon changing, and would be observed as a drift
        bug here.

  - id: proteon-sasa-vs-biopython-release-1k-pdbs
    title: >
      Proteon SASA agrees with Biopython across a 1000-file validation
      sample (Biopython-comparable subset n≈810; median rel diff 0.2% <
      0.5% band)
    kind: measurement
    subsystem: sasa
    case: claims/sasa.md
    source: ..
    tier: release
    trust_strategy:
      - validation
    capabilities:
      - sasa-accuracy-distributional
    inputs:
      corpus: validation-pdbs-1k
      n: 1000
      # The runner takes sorted(os.listdir(pdb_dir))[:1000] — the
      # alphabetically-first 1000 files, not a randomised draw.
      class: convenience-sample
      n_with_biopython_comparison: 810  # ~190 are .cif (Biopython's PDBParser
      # can't read mmCIF) or load failures; they carry no oracle comparison
      # and are excluded from the median below.
      corpus_sha: "b319c47c59871ed3990f81fb025c6ae90abba6adcff0b91ff7f118e41c730a53"  # sha256 of evidence artifact; results.json records per-PDB diffs
    outputs:
      total_sasa:
        unit: A^2
        description: Per-structure total solvent-accessible surface area.
    pinned_versions:
      proteon: "0.2.0"
      Biopython: "1.87"
      python: "3.12"
    claim: >
      Across the alphabetically-first 1000 files of the validation corpus,
      proteon total SASA agrees with Biopython's reference Shrake-Rupley
      implementation: the median relative deviation is < 0.5% over the ~810
      files Biopython can parse (Biopython's PDBParser cannot read the ~163
      .cif files, which therefore carry no comparison). A single-oracle
      agreement is a weaker correctness signal than two independent oracles
      — FreeSASA was evaluated as a second oracle but is NOT gated here: it
      diverges from proteon by ~4.5% at the median (atom-radius and
      probe-discretisation conventions, not a proteon error), well outside
      a parity band, so claiming cross-tool parity would be unsupported.
      See failure_modes.
    tolerances:
      - metric: median_relative_error
        op: "<"
        value: 0.005
        output: total_sasa
        scoring:
          artifact: validation/results.json
          format: json
          records_path: results
          select:
            list: tests
            match: {test: sasa}
            take: details
          value: relative_diff
          where: {field: relative_diff, present: true}
          aggregate: median
        prose: >
          Median(|proteon_total - biopython_total| / biopython_total) < 0.005
          across the 1000-structure validation/pdbs corpus.
      - metric: pass_rate
        op: ">="
        value: 0.95
        output: total_sasa
        scoring:
          artifact: validation/results.json
          format: json
          records_path: results
          select:
            list: tests
            match: {test: sasa}
            take: details
          # Biopython-only per-structure agreement, over the files Biopython
          # could parse (those carrying a relative_diff). The artifact's
          # 'status' field folds in FreeSASA-driven 'warn' downgrades, so we
          # gate on the Biopython per-structure rel diff directly instead.
          value: relative_diff
          where: {field: relative_diff, present: true}
          pass_when: {op: "<", value: 0.05}
        prose: >
          >= 95% of the ~810 Biopython-comparable files agree with proteon
          to within 5% per-structure relative diff, computed directly from
          the Biopython relative_diff (not the artifact's two-oracle 'status'
          field). Per-structure diffs are recorded in
          validation/run_validation.py::test_sasa.
    evidence:
      oracle:
        - Biopython
      command: >
        python validation/run_validation.py --n-structures 1000
        --pdb-dir validation/pdbs/ --output validation/results.json
      artifact: validation/results.json (archived in the v0.2.0-evidence.tar.gz release asset)
    provenance: human
    last_verified:
      commit: "4d6ddbec100b810b85c0d2104ecd63d78ac848ec"
      date: "2026-05-11"
      value: 0.0017
      corpus_sha: "b319c47c59871ed3990f81fb025c6ae90abba6adcff0b91ff7f118e41c730a53"
    assumptions:
      - The corpus is the alphabetically-first 1000 files of validation/pdbs/
        (a convenience sample, not a randomised draw); it is biased toward
        small soluble proteins and toward PDB-format files. Not a
        representative sample of arbitrary deployment input.
      - Biopython's PDBParser cannot read mmCIF, so the ~163 .cif files in
        the sample carry no Biopython comparison and are excluded from the
        median and the per-structure pass-rate (they are not silently
        counted as agreeing).
      - The pinned Biopython version remains a stable Shrake-Rupley reference
        for the lifetime of the cited result.
    failure_modes:
      - FreeSASA was evaluated as a second, independent oracle but is NOT
        gated by this claim. It diverges from proteon by ~4.5% at the median
        on this corpus — driven by FreeSASA's different default atomic-radii
        and probe-discretisation conventions, not a proteon error — which is
        well outside any parity band. A cross-tool-parity claim against
        FreeSASA is therefore unsupported and was dropped (GitHub issue 84);
        recording it here keeps the measurement on the record without
        overstating it. The artifact still carries the per-structure
        freesasa_relative_diff for anyone reanalysing.
      - Single-oracle agreement (Biopython only) is a weaker correctness
        signal than two independent oracles would be. The CI-tier 1crn
        fixture claim and the broader force-field/geometry oracles bound
        the same code from other directions.
      - inputs.corpus_sha is pinned to the SHA-256 of the evidence
        artifact validation/results.json (which records per-structure
        relative diffs for every PDB in the run); the input PDB corpus
        validation/pdbs/ is not archived in-repo, so full forensic
        replay still requires preserving those PDBs alongside the JSON.
      - results.json records summary counts and relative diffs but not the
        absolute SASA values; full forensic replay requires the corpus PDBs
        to be preserved alongside the JSON.
