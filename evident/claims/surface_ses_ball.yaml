claims:
  - id: proteon-ses-vs-ball-ci
    title: Proteon analytic SES mesh area agrees with BALL's analytic SES on crambin within sub-percent tolerance
    kind: measurement
    subsystem: surface.ses
    case: claims/surface_ses_ball.md
    source: ..
    tier: ci
    trust_strategy:
      - validation
    capabilities:
      - surface-ses-area-parity
    inputs:
      corpus: surface-fixture-set
      n: 5
      class: convenience-sample
      fixture_paths:
        - test-pdbs/1crn.pdb   # crambin, 327 atoms
        - test-pdbs/1bpi.pdb   # BPTI, ~626 atoms
        - test-pdbs/1aaj.pdb   # ~905 atoms; former degenerate-crash regression guard
        - test-pdbs/1ubq.pdb   # ubiquitin, ~1271 atoms
        - test-pdbs/1ake.pdb   # adenylate kinase, ~3804 atoms (2-domain, scale diversity)
    outputs:
      ses_area:
        unit: A^2
        description: >
          Solvent-excluded (Connolly) surface area at probe radius 1.4 A.
          proteon meshes the analytic SES (proteon-core surface pipeline,
          exposed via the connector's ses_mesh_py) and reports the
          triangulated mesh area; BALL computes the closed-form analytic
          area via calculateSESArea (ball.ses_area). BOTH are fed the
          identical sphere set (same centres + the same per-element vdW
          radii), so the comparison isolates the meshing/area algorithm,
          not radius-assignment differences.
      ses_volume:
        unit: A^3
        description: >
          Enclosed SES volume at probe 1.4 A — proteon's mesh signed
          volume vs BALL's calculateSESVolume on the same spheres.
      watertight:
        unit: bool
        description: >
          proteon's mesh is closed (2-manifold, every edge shared by
          exactly two triangles). A non-watertight mesh has an ill-defined
          area/volume, so this is the precondition that makes the area
          comparison meaningful.
    pinned_versions:
      proteon: "PENDING-PIN-AT-NEXT-RELEASE"
      BALL: "PENDING-PIN-BALL-PY-0.1.0a6"
      python: "3.12"
    claim: >
      Across five structures spanning 327 to ~3804 atoms (crambin, BPTI,
      1aaj, ubiquitin, adenylate kinase), proteon's analytic SES mesh and
      BALL's analytic calculateSESArea/Volume — fed byte-identical spheres
      at probe 1.4 A — report SES area agreeing within 0.5% relative and
      volume within 1.0% relative, with proteon's mesh watertight (the area
      is well-defined) and produced by the analytic path. Measured residual
      is +0.04% (1crn) to +0.08% (1ake). This is the surface-subsystem
      analogue of the "+0.05% vs BALL" area validation, promoted to a
      CI-gated, multi-structure oracle against the reference Connolly
      implementation proteon's mesher ports from.
    tolerances:
      - metric: relative_error
        op: "<"
        value: 0.005
        output: ses_area
        prose: >
          "|proteon - BALL| / BALL < 0.5% on SES area." On a clean
          single-chain protein both meshers resolve the same analytic
          surface; the residual is mesh-discretisation (proteon
          triangulates; BALL integrates the closed form). Measured ~0.05%
          on clean inputs and <=0.32% across a degenerate 22-protein subset
          (perturbation-recovered); the 0.5% band gates against an
          algorithmic regression without tripping on discretisation noise.
      - metric: relative_error
        op: "<"
        value: 0.01
        output: ses_volume
        prose: >
          "|proteon - BALL| / BALL < 1.0% on SES volume." Volume is
          looser than area because a triangulated mesh's enclosed volume
          carries the integrated discretisation error of every facet; 1%
          is the field-standard band for a sampled-vs-analytic SES volume.
      - metric: pass_rate
        op: ">="
        value: 1.0
        output: watertight
        prose: >
          Every fixture's proteon SES mesh must be closed (watertight) —
          pass_rate == 1.0 over the five structures. If any is not closed,
          the analytic path failed or fell back to the numerical grid, so
          its area/volume comparison would be against a different surface;
          this gates the whole claim.
    evidence:
      oracle:
        - BALL
      command: pytest tests/oracle/test_ses_ball_oracle.py::TestSesBallOracle -v
      artifact: pytest console output (CI-tier; no persisted artifact)
    provenance: automatic
    last_verified:
      commit: null
      date: null
      value: null
      corpus_sha: null
    assumptions:
      - The BALL Python bindings (ball-py PyPI package, source
        github.com/theGreatHerrLebert/ball) provide
        ball.ses_area(spheres, probe_radius) returning a dict with
        "area" and "volume" keys, where spheres is a list of [x,y,z,r].
        Added in ball-py 0.1.0a6 (the ses_mesh/ses_area/ses_graph
        bindings — commits 8d8a9d27/73c21e88). Earlier wheels (the CI pin
        was 0.1.0a4) lack it; the test skips with a clear reason via
        pytest.importorskip("ball") + hasattr(ball, "ses_area").
      - The proteon connector exposes py_surface.ses_mesh_py(coords,
        radii=, probe=) returning a dict with "area", "volume",
        "watertight". This ships on the surface (feat/mesh-export) branch;
        the test skips if the installed connector predates it.
      - Both sides receive identical spheres. The test loads 1crn, takes
        proteon's atom coordinates, assigns a fixed per-element vdW radius
        table (C 1.70, N 1.55, O 1.52, S 1.80, H 1.20, default 1.70 A),
        and passes the SAME radii array to ses_mesh_py(radii=) and packs
        it into ball.ses_area's spheres. So any disagreement is meshing,
        not radius assignment.
      - Crambin meshes on the analytic path without perturbation (it is in
        the surface pipeline's clean repro set). If a future change makes
        it degenerate, the watertight gate + method check surface that as
        a failure rather than a silent grid-fallback comparison.
    failure_modes:
      - Five fixtures spanning 327-3804 atoms, all single structures from
        the repo. A regression that only manifests on multi-chain
        complexes, or on inputs that need the perturbation-recovery path
        (none of these five are degenerate enough to require it), would not
        surface. A release-tier version over a large diverse corpus that
        exercises perturbation recovery is the natural follow-up; the five
        clean fixtures here gate the core area/volume algorithm across a
        useful scale range against the reference.
      - The fixed radius table is the test's, not proteon's internal
        vdW_radius. This is deliberate (identical inputs both sides) but
        means the claim validates the MESHER, not proteon's radius
        assignment — that is a separate concern covered by the SASA
        oracle. If the table drifts from realistic vdW values the area is
        still a valid parity check, just on less physical spheres.
      - BALL's analytic calculateSESArea is robust to the near-tangency
        degeneracies that defeat its OWN triangulation (ball.ses_mesh
        raises DivisionByZero on e.g. 1ijp). Crambin is clean, so this
        does not bite here, but a degenerate release-corpus fixture must
        compare against ball.ses_area (analytic), never ball.ses_mesh.
