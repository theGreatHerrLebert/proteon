version: 0.1
project: proteon

# Proteon's EVIDENT manifest. Each claim describes a defensible numerical
# or structural-biology assertion proteon makes, with an oracle, tolerance,
# reproducible command, and recorded artifact.
#
# Release-tier evidence artifacts are too large for the git tree; they are
# archived in the v0.2.0 evidence bundle, attached as a release asset:
#   https://github.com/theGreatHerrLebert/proteon/releases/download/v0.2.0/v0.2.0-evidence.tar.gz
# Each release claim's evidence.artifact names the file's path inside that
# bundle; inputs.corpus_sha / last_verified.corpus_sha hold its SHA-256, so
# the in-repo manifest and the out-of-repo bundle are cross-checkable. The
# bundle ships a SHA256SUMS file carrying the same hashes.
#
# Per-component claim files live under claims/ and are merged into a single
# id namespace by the validator. Validate with:
#
#   python -m evident.validate proteon/evident/evident.yaml
#
# (or workflow/validate_manifest.py from the EVIDENT framework repo).
# Path references inside claim files resolve from the directory of this
# top-level manifest, not from the included file.
#
# See evident/workflow/SCHEMA.md (in the framework repo) for the full schema.

vocabularies:
  tolerance_metric:
    - signed_difference   # a - b, one-sided bounds (improper torsion vs BALL)
  subsystem:
    - io
    - sasa
    - dssp
    - hbond
    - prep.hydrogens
    - align.tmalign
    - align.usalign
    - geometry
    - forcefield.charmm19
    - forcefield.amber96
    - gb.obc
    - energy.cross-path
    - minimize
    - search.mmseqs
    - supervision
    - pipeline.batch
    - surface.ses
    - electrostatics.laplace
    - electrostatics.yukawa
    - electrostatics.bem.local
    - electrostatics.post
    - electrostatics.bem.nonlocal
  oracle:
    - Biopython
    - FreeSASA
    - OpenMM
    - BALL
    - Gemmi
    - USAlign
    - MMseqs2
    - pydssp
    - reduce
    - GROMACS
    - proteon-slow-path
    - physics-invariant
    - mkdssp
    - NESSie
  capability:
    - sasa-accuracy-pointwise
    - sasa-accuracy-distributional
    - alignment-tmscore-parity
    - alignment-rmsd-parity
    - alignment-length-parity
    - io-counts-parity
    - io-coords-parity
    - io-metadata-parity
    - dssp-3class-parity
    - dssp-helix-fraction-parity
    - dssp-strand-fraction-parity
    - hydrogens-rigid-placement-parity
    - hydrogens-backbone-amide-coverage-parity
    - forcefield-energy-component-parity
    - forcefield-total-energy-parity
    - gb-energy-parity
    - energy-path-parity
    - fold-preservation-after-minimization
    - search-msa-feature-parity
    - supervision-rust-python-parity
    - pipeline-survives-at-scale
    - pipeline-physics-consistent-at-scale
    - energy-gpu-cpu-parity
    - dssp-8class-parity
    - sasa-cross-tool-parity
    - acceleration-paths-parity
    - surface-ses-area-parity
    - laplace-collocation-parity
    - regular-yukawa-collocation-parity
    - local-cauchy-data-parity
    - born-energy-converges-to-analytic
    - nonlocal-cauchy-data-parity
  input_class:
    # Extends the base vocabulary. A convenience sample is a non-random
    # selection (e.g. the alphabetically-first N files) — distinguished from
    # random-sample so a claim can't imply randomisation it didn't do.
    - convenience-sample

include:
  - claims/release_gate.yaml
  - claims/sasa.yaml
  - claims/tmalign.yaml
  - claims/io.yaml
  - claims/dssp.yaml
  - claims/hydrogens.yaml
  - claims/forcefield_amber_ball.yaml
  - claims/gb_obc.yaml
  - claims/cross_path_parity.yaml
  - claims/fold_preservation_charmm.yaml
  - claims/fold_preservation_amber.yaml
  - claims/fold_preservation_gromacs.yaml
  - claims/supervision_parity.yaml
  - claims/scale_50k_battle_test.yaml
  - claims/dssp_8class.yaml
  - claims/dssp_8class_50k.yaml
  - claims/usalign_mm.yaml
  - claims/forcefield_charmm19_ball.yaml
  - claims/forcefield_charmm19_ball_corpus.yaml
  - claims/forcefield_charmm19_ball_corpus_50k.yaml
  - claims/forcefield_amber_openmm_50k.yaml
  - claims/fold_preservation_charmm_50k.yaml
  - claims/fold_preservation_amber_50k.yaml
  - claims/geometry_rmsd_ball.yaml
  - claims/surface_ses_ball.yaml
  - claims/electrostatics_laplace.yaml
  - claims/electrostatics_yukawa.yaml
  - claims/electrostatics_local_solve.yaml
  - claims/electrostatics_post.yaml
  - claims/electrostatics_nonlocal.yaml
